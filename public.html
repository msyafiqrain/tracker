<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Tier Institute — Public Intake View</title><style>:root{--bg:#06100a;--panel:#0d1c14;--border:#1f3a2c;--gold:#c9a84c;--cream:#e8d9bc;--muted:#8a9a8e;--green:#6fae7f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:Arial,sans-serif;padding:24px}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:18px}.top h1{margin:0}.sub{color:var(--muted);font-size:13px;margin-top:6px}.status{border:1px solid var(--border);background:var(--panel);padding:9px 12px;font-size:12px}.status.ok{color:var(--green)}.notice{margin:18px 0;padding:12px;border-left:3px solid var(--gold);background:var(--panel);color:var(--muted);font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar select{background:var(--panel);color:var(--cream);border:1px solid var(--border);padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--border);padding:18px}.card h3{margin:0 0 8px}.meta{color:var(--muted);font-size:12px;margin:5px 0}.bar{height:7px;background:#122820;margin:12px 0}.bar i{display:block;height:100%;background:var(--gold)}.big{font-size:22px;color:var(--gold)}.small{font-size:11px;color:var(--muted)}a{color:var(--gold);text-decoration:none}@media(max-width:700px){body{padding:14px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>Top Tier Institute</h1><div class="sub">Public Intake Availability</div></div><div id="status" class="status">Connecting…</div></div><div class="notice">This public view shows intake dates and seat availability only. Student names, payment details and private records are not displayed.</div><div class="toolbar"><select id="course"><option value="">All courses</option><option value="WSD">WSD</option><option value="BOOTCAMP ESSENTIALS">BOOTCAMP ESSENTIALS</option></select><select id="sort"><option value="dateAsc">Soonest first</option><option value="dateDesc">Latest first</option><option value="seatsAsc">Fewest seats left</option><option value="seatsDesc">Most seats left</option></select><span class="small" id="updated"></span></div><div id="grid" class="grid"></div><p class="small" style="margin-top:22px">Internal tracker: <a href="./">open read-only operations dashboard</a></p></div><script>const URL='https://kdnbutlgooskjmrgflga.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbmJ1dGxnb29za2ptcmdmbGdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTIzNjksImV4cCI6MjEwMjI2ODM2OX0.VHu5zh2YFJdf0N4OBSEkRtRZTeKIFGF53uT-k0MXIjA',headers={apikey:KEY,Authorization:'Bearer '+KEY};let intakes=[],students=[];const $=id=>document.getElementById(id),fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'}):'—';async function api(p){const r=await fetch(URL+'/rest/v1/'+p,{headers,cache:'no-store'});if(!r.ok)throw new Error(await r.text());return r.json()}function endDate(i){const s=Array.isArray(i.sessions)?i.sessions:[],d=s.map(x=>x.date).filter(Boolean).sort();return d.at(-1)||i.start_date}function render(){const c=$('course').value,mode=$('sort').value,now=new Date();let list=intakes.filter(i=>(!c||i.course===c)&&new Date((endDate(i)||i.start_date)+'T23:59:59')>=now);list.sort((a,b)=>{const ae=students.filter(s=>s.intake===a.name).length,be=students.filter(s=>s.intake===b.name).length,al=Math.max(0,Number(a.seats||0)-ae),bl=Math.max(0,Number(b.seats||0)-be);if(mode==='dateDesc')return String(b.start_date).localeCompare(String(a.start_date));if(mode==='seatsAsc')return al-bl;if(mode==='seatsDesc')return bl-al;return String(a.start_date).localeCompare(String(b.start_date))});$('grid').innerHTML=list.map(i=>{const enrolled=students.filter(s=>s.intake===i.name).length,seats=Number(i.seats||0),left=Math.max(0,seats-enrolled),pct=seats?Math.min(100,enrolled/seats*100):0;return `<div class="card"><h3>${i.name}</h3><div class="meta">${i.course||'—'} · ${fmt(i.start_date)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="big">${left} seats left</div><div class="meta">${enrolled}${seats?' / '+seats:''} enrolled</div></div>`}).join('')||'<div class="notice">No upcoming intakes found.</div>'}async function load(){try{$('status').textContent='Loading…';[intakes,students]=await Promise.all([api('intakes?select=id,name,course,start_date,seats,sessions&order=start_date.asc'),api('students?select=intake')]);render();$('status').textContent='Live';$('status').className='status ok';$('updated').textContent='Last updated '+new Date().toLocaleString('en-SG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){$('status').textContent='Connection error'}}$('course').onchange=render;$('sort').onchange=render;load();setInterval(load,30000);</script></body></html>
